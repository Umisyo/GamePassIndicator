name: Deploy Catalog to Pages

# generated/ をサイトルートとしてGitHub Pagesへ公開する。
# 例: https://umisyo.github.io/GamePassIndicator/catalog-ja-jp.json
on:
  push:
    branches: [main]
    paths:
      - "generated/**"
  # nightly の Update Game Pass Catalog 完了後に自動デプロイする。
  # （GITHUB_TOKEN のコミットは push トリガーを発火しないため workflow_run で拾う）
  workflow_run:
    workflows: ["Update Game Pass Catalog"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # workflow_run の場合は成功時のみデプロイ（失敗した更新は公開しない）。
    if: >
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # main の最新（＝nightlyがpushしたカタログを含む）を取得する。
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: generated
      - id: deploy
        uses: actions/deploy-pages@v4
