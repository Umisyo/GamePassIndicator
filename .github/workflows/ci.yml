name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test

      - name: Install Playwright browser
        run: pnpm --filter @gamepass-indicator/extension exec playwright install --with-deps chromium
      - name: E2E tests
        run: pnpm --filter @gamepass-indicator/extension test:e2e

      - name: Package extension
        run: pnpm --filter @gamepass-indicator/extension package

      - name: Upload extension zip
        uses: actions/upload-artifact@v4
        with:
          name: extension
          path: apps/extension/extension.zip
          if-no-files-found: error
