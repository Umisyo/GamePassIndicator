<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Steam Game Pass Indicator 設定</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 24px;
        max-width: 520px;
        line-height: 1.6;
      }
      h1 {
        font-size: 18px;
      }
      label {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 12px 0;
      }
      .note {
        color: #666;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <h1>Steam Game Pass Indicator 設定</h1>
    <p class="note">対象地域: 日本 (JP) / PC Game Pass</p>
    <label>
      <input type="checkbox" id="show-leaving-date" />
      提供終了予定日を表示する
    </label>
    <label>
      <input type="checkbox" id="show-unavailable" />
      対象外の作品にも表示する（将来用・MVPでは無効）
    </label>

    <hr />
    <h2 style="font-size: 15px">カタログ</h2>
    <p class="note">最終更新: <span id="catalog-updated">—</span></p>
    <button id="refresh" type="button">今すぐ更新</button>

    <script type="module" src="options.js"></script>
  </body>
</html>
